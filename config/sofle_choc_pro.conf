# Mouse emulation — the right encoder scrolls.
CONFIG_ZMK_POINTING=y

# Custom keyboard name (max. 16 characters)
CONFIG_ZMK_KEYBOARD_NAME="Sofle Erkan"

# RGB bleibt aus, bis ADJUST + RGB_TOG es einschaltet.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Report the right (peripheral) half's battery too, as a second Battery
# Service instance, instead of only the left/central half's.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
